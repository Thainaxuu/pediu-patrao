<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#novoPedidoModal">
            <i class="bi bi-plus-lg me-1"></i>Novo Pedido
        </button>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Cliente ID</th>
                        <th>Tipo de Pizza</th>
                        <th>Sabor</th>
                        <th>Quantidade</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Lista vazia -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="6" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <!-- Linhas -->
                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-4 text-muted" th:text="${pedido.id}"></td>
                        <td th:text="${pedido.clienteId}"></td>
                        <td th:text="${pedido.tipoPizza}"></td>
                        <td th:text="${pedido.sabor}"></td>
                        <td th:text="${pedido.quantidade}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${pedido.status == 'ENTREGUE'} ? 'bg-success' :
                                                  (${pedido.status == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status == 'EM_PREPARO'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                  th:text="${pedido.status}">
                            </span>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

    <!-- Modal: Novo Pedido -->
    <div class="modal fade" id="novoPedidoModal" tabindex="-1" aria-labelledby="novoPedidoModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form th:action="@{/pedidos/salvar}" method="post">
                    <div class="modal-header">
                        <h5 class="modal-title" id="novoPedidoModalLabel">
                            <i class="bi bi-bag-plus me-2 text-primary"></i>Novo Pedido
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">

                        <div class="mb-3">
                            <label for="clienteId" class="form-label">Cliente</label>
                            <select class="form-select" id="clienteId" name="clienteId" required
                                    onchange="this.form.nomeCliente.value = this.value ? this.options[this.selectedIndex].text : ''">
                                <option value="">Selecione um cliente</option>
                                <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
                            </select>
                            <input type="hidden" name="nomeCliente" value="">
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="tipoPizza" class="form-label">Tipo de Pizza</label>
                                <input type="text" class="form-control" id="tipoPizza" name="tipoPizza" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="sabor" class="form-label">Sabor</label>
                                <input type="text" class="form-control" id="sabor" name="sabor" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="quantidade" class="form-label">Quantidade</label>
                                <input type="number" class="form-control" id="quantidade" name="quantidade"
                                       min="1" step="1" value="1" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="precoUnitario" class="form-label">Preço Unitário (R$)</label>
                                <input type="number" class="form-control" id="precoUnitario" name="precoUnitario"
                                       min="0.01" step="0.01" placeholder="0,00" required>
                            </div>
                        </div>

                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>Registrar Pedido
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</div>

</body>
</html>
